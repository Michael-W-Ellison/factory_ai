[mypy]
# Mypy configuration for Recycling Factory

# Python version
python_version = 3.11

# Warning settings
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Error settings - relaxed for gradual adoption
ignore_missing_imports = true
no_implicit_optional = true

# Strictness - start lenient, can increase over time
strict = false
check_untyped_defs = false
disallow_untyped_defs = false

# Show error codes
show_error_codes = true

# Exclude directories
exclude = (?x)(
    ^build/
    | ^dist/
    | ^data/
    | ^\.venv/
    | ^venv/
    | __pycache__
)

# Per-module overrides for stricter checking on new code
[mypy-src.core.logger]
disallow_untyped_defs = true

[mypy-src.systems.save_manager]
disallow_untyped_defs = true

# Ignore errors in test files (often have dynamic types)
[mypy-test_*]
ignore_errors = true
